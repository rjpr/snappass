<!DOCTYPE html>
<html lang="{{ _('en') }}">
  <head>
    <title>{{ config.SITE_TITLE if config.SITE_TITLE else _('Snappass - Share Secrets') }}</title>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@picocss/pico@2/css/pico.min.css">
    <link href="{{ config.STATIC_URL }}/snappass/css/custom.css" rel="stylesheet">
  </head>
  <body>
    <main class="container">
      {% if request.endpoint in ['index', 'handle_password'] %}
        <h1>{{ _('Share a secret') }}</h1>
      {% else %}
        <h1>{{ _('View shared secret') }}</h1>
      {% endif %}
      
      {% block content %}{% endblock %}
    </main>

    {% block js %}{% endblock %}
  </body>
</html>
